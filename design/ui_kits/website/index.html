<script type="text/babel">
const {TopNav}=window.MichaelJosiahDesignSystem_bafdc6;
function App(){

  const go=r=>{setRoute(r);window.scrollTo(0,0);};

  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
