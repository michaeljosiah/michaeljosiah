<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page);font:var(--type-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-body);font-size:var(--fs-nano);letter-spacing:.06em}.lbl{font-family:var(--font-display);font-size:var(--fs-nano);letter-spacing:var(--ls-caps-wide);color:var(--text-faint);text-transform:uppercase;margin-bottom:8px}</style></head><body><div style="display:flex;align-items:baseline;gap:16px;padding:5px 0"><code style="font-size:var(--fs-nano);color:var(--text-faint);width:150px;flex:none">--text-display</code><span style="color:var(--text-display);font-size:var(--fs-h2)">display</span></div><div style="display:flex;align-items:baseline;gap:16px;padding:5px 0"><code style="font-size:var(--fs-nano);color:var(--text-faint);width:150px;flex:none">--text-heading</code><span style="color:var(--text-heading);font-size:var(--fs-h3)">heading</span></div><div style="display:flex;align-items:baseline;gap:16px;padding:5px 0"><code style="font-size:var(--fs-nano);color:var(--text-faint);width:150px;flex:none">--text-body</code><span style="color:var(--text-body);font-size:var(--fs-body)">body</span></div><div style="display:flex;align-items:baseline;gap:16px;padding:5px 0"><code style="font-size:var(--fs-nano);color:var(--text-faint);width:150px;flex:none">--text-muted</code><span style="color:var(--text-muted);font-size:var(--fs-body-sm)">muted — meta, timestamps</span></div><div style="display:flex;align-items:baseline;gap:16px;padding:5px 0"><code style="font-size:var(--fs-nano);color:var(--text-faint);width:150px;flex:none">--text-faint</code><span style="color:var(--text-faint);font-size:var(--fs-body-sm)">faint — disabled</span></div><div style="display:flex;align-items:baseline;gap:16px;padding:5px 0"><code style="font-size:var(--fs-nano);color:var(--text-faint);width:150px;flex:none">--
