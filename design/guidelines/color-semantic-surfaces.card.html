<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page);font:var(--type-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-body);font-size:var(--fs-nano);letter-spacing:.06em}.lbl{font-family:var(--font-display);font-size:var(--fs-nano);letter-spacing:var(--ls-caps-wide);color:var(--text-faint);text-transform:uppercase;margin-bottom:8px}</style></head><body><div style="display:flex;gap:2px;align-items:stretch;height:96px"><div style="flex:1;background:var(--surface-page);border:1px solid var(--line-hairline);display:flex;align-items:flex-end;padding:8px;font-size:var(--fs-nano);color:var(--text-muted);letter-spacing:.06em">page</div><div style="flex:1;background:var(--surface-shell);border:1px solid var(--line-hairline);display:flex;align-items:flex-end;padding:8px;font-size:var(--fs-nano);color:var(--text-muted);letter-spacing:.06em">shell</div><div style="flex:1;background:var(--surface-panel);border:1px solid var(--line-hairline);display:flex;align-items:flex-end;padding:8px;font-size:var(--fs-nano);color:var(--text-muted);letter-spacing:.06em">panel</div><div style="flex:1;background:var(--surface-card);border:1px solid var(--line-hairline);display:flex;align-items:flex-end;padding:8px;font-size:var(--fs-nano);color:var(--text-muted);letter-spacing:.06em">card</div><div style="flex:1;background:var(--surface-card-hover);border:1px solid var(--line-hairline);display:flex;align-items:flex-end;padding:8px;font-size:var(--fs-nano);color:var(--text-muted);letter-spacing:.06em">card-hover</div><div style="flex:1;background:var(--surface-raised);border:1px solid var(--line-hairline);display:flex;align-items:flex-end;padding:8px;font-size:var(--fs-nano);color:var(--text-muted);letter-spacing:.06em">raised</div></div></body></html>
