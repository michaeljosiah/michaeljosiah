<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page);font:var(--type-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-body);font-size:var(--fs-nano);letter-spacing:.06em}.lbl{font-family:var(--font-display);font-size:var(--fs-nano);letter-spacing:var(--ls-caps-wide);color:var(--text-faint);text-transform:uppercase;margin-bottom:8px}</style></head><body><style>@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}</style>
 <div style="display:flex;gap:28px;align-items:center">
 <div style="flex:1"><div style="animation:rise var(--dur-slow) var(--ease-out) infinite alternate;background:var(--surface-card);border:1px solid var(--line-hairline);border-radius:var(--radius-md);padding:14px;font-size:var(--fs-body-sm);color:var(--text-body)">Entrance &middot; fade + 12px rise &middot; 420ms</div></div>
 <div style="width:70px;height:70px;border:2px solid var(--gold-400);border-radius:var(--radius-pill);animation:pulse var(--dur-ambient) var(--ease-in-out) infinite"></div></div>
 <div style="margin-top:14px;font-size:var(--fs-micro);color:var(--text-faint)">--ease-out cubic-bezier(.16,.84,.44,1) &middot; fast 140 / base 220 / slow 420 / ambient 6s</div></body></html>
