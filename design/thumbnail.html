<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:854px;width:1280px;overflow:hidden}body{display:flex}
.main{flex:1;background:var(--gold-400);display:grid;place-items:center}
.mark{font-family:var(--font-display);font-weight:var(--fw-bold);font-size:150px;letter-spacing:.02em;color:var(--ink-1000);text-transform:uppercase;line-height:1;text-align:center}
.strip{width:22%;display:flex;flex-direction:column}.strip div{flex:1}</style></head>
<body><div class="main"><div class="mark">Michael<br>Josiah</div></div>
<div class="strip"><div style="background:var(--teal-300)"></div><div style="background:var(--teal-400)"></div><div style="background:var(--violet-400)"></div><div style="background:var(--ember-blue-500)"></div></div></body></html>
