<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:18px;background:var(--surface-page)}.lbl{font-family:var(--font-display);font-size:var(--fs-nano);letter-spacing:var(--ls-caps-wide);color:var(--text-faint);text-transform:uppercase;margin-bottom:10px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS=window.MichaelJosiahDesignSystem_bafdc6;

const {TextField,SearchInput,Select,SubscribePanel,Button,Eyebrow,Icon}=NS;
function Demo(){
 const [sort,setSort]=React.useState('Featured');
 return <div style={{display:'flex',flexDirection:'column',gap:20}}>
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,alignItems:'start'}}>
   <div style={{display:'flex',flexDirection:'column',gap:12}}>
    <Eyebrow>Send a message</Eyebrow>
    <TextField placeholder="Your Name" icon="user"/>
    <TextField placeholder="Your Email" icon="mail"/>
    <TextField placeholder="Your Message" icon="pencil" multiline rows={3}/>
    <Button style={{width:'100%'}}>Send message</Button>
    <div style={{display:'flex',gap:8,alignItems:'flex-start',color:'var(--text-faint)',font:'var(--fw-regular) var(--fs-micro)/1.5 var(--font-body)'}}>
     <Icon name="lock" size={12} style={{marginTop:2,color:'var(--gold-500)'}}/>
     <span>I respect your privacy. Your information will never be shared.</span></div>
   </div>
   <div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div><div className="lbl">Search</div><SearchInput placeholder="Search journal..."/></div>
    <div><div className="lbl">Select</div><Select label="Sort by:" value={sort} options={['Featured','Newest','A–Z']} onChange={setSort}/></div>
   </div>
  </div>
  <SubscribePanel/>
 </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
