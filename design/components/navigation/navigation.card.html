<!-- @dsCard group="Components" viewport="700x360" name="Navigation" subtitle="Header, social rail, filter tabs, category sidebar" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:18px;background:var(--surface-page)}.lbl{font-family:var(--font-display);font-size:var(--fs-nano);letter-spacing:var(--ls-caps-wide);color:var(--text-faint);text-transform:uppercase;margin-bottom:10px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS=window.MichaelJosiahDesignSystem_bafdc6;

const {TopNav,SocialRail,FilterTabs,CategorySidebar}=NS;
function Demo(){
 const [route,setRoute]=React.useState('Projects');
 const [tab,setTab]=React.useState('All');
 const [cat,setCat]=React.useState('All projects');
 return <div style={{display:'flex',flexDirection:'column',gap:20}}>
  <div style={{margin:'-18px -18px 0'}}><TopNav items={['Home','Projects','About','Journal','Contact']} active={route} onNavigate={setRoute} logoSrc="../../assets/logo-monogram.png"/></div>
  <div><div className="lbl">Filter tabs</div><FilterTabs items={['All','Storytelling','Engineering','AI & Tech','Leadership','Life']} active={tab} onChange={setTab}/></div>
  <div style={{display:'flex',gap:20}}>
   <div style={{height:190}}><div className="lbl">Rail</div><SocialRail style={{height:160}} links={[{icon:'linkedin'},{icon:'instagram'},{icon:'youtube'},{icon:'mail'}]}/></div>
   <div style={{flex:1}}><div className="lbl">Category sidebar</div>
    <CategorySidebar active={cat} onSelect={setCat} items={[{label:'All projects',icon:'layout-grid',count:14},{label:'Story worlds',icon:'feather',count:4},{label:'AI platforms',icon:'triangle',count:3},{label:'Tools & systems',icon:'wrench',count:3}]} style={{background:'var(--surface-panel)',border:'1px solid var(--line-hairline)'}}/></div>
  </div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
