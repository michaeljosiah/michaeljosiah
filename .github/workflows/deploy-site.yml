name: Deploy portfolio

on:
  push:
    branches:
      - master
    paths:
      - site/**
      - design/assets/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Stage static site
        shell: bash
        run: |
          mkdir -p deployment/design
          cp -R site/. deployment/
          cp -R design/assets deployment/design/assets
          test -f deployment/index.html
          test -f deployment/design/assets/logo-monogram.png

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /deployment
          api_location: ""
          output_location: ""
          skip_app_build: true
